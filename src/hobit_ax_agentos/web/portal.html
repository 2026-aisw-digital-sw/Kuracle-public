<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hobit AX Portal</title>
    <link rel="stylesheet" href="/ui/portal.css" />
  </head>
  <body>
    <main class="portal">
      <header class="hero">
        <nav class="nav">
          <div class="brand">
            <span class="brand-mark">H</span>
            <span>Hobit AX</span>
          </div>
          <a href="/app">Admin Console</a>
        </nav>
        <section class="hero-body">
          <div>
            <p class="eyebrow">Student Service</p>
            <h1>학사 규정 상담과 행정 처리 알림을 한 곳에서</h1>
            <p class="lead">
              질문에 답하고, 지금 처리해야 할 행정 업무를 먼저 알려주며, 에이전트가 미리 준비한 답변을 이어서 볼 수 있습니다.
            </p>
          </div>
          <form id="identityForm" class="identity">
            <label>
              <span>Session</span>
              <input id="portalSession" value="web-session" autocomplete="off" />
            </label>
            <label>
              <span>User</span>
              <input id="portalUser" value="web-user" autocomplete="off" />
            </label>
            <label>
              <span>API Token</span>
              <input id="portalToken" type="password" autocomplete="off" placeholder="optional" />
            </label>
            <button type="submit">Sync</button>
          </form>
        </section>
      </header>

      <section class="content">
        <section class="notice-strip" aria-label="Proactive action inbox">
          <div class="section-head">
            <div>
              <p class="eyebrow">Trigger Agent</p>
              <h2>행정 처리 Inbox</h2>
            </div>
            <button id="refreshAlerts" type="button">Refresh</button>
          </div>
          <div id="alertCards" class="cards horizontal"></div>
        </section>

        <section class="main-grid">
          <section class="assistant-panel">
            <div class="section-head">
              <div>
                <p class="eyebrow">Knowledge Agent</p>
                <h2>질문하기</h2>
              </div>
              <label class="toggle">
                <input id="portalAsync" type="checkbox" checked />
                <span>Async</span>
              </label>
            </div>
            <div id="portalMessages" class="messages"></div>
            <form id="portalAskForm" class="composer">
              <textarea
                id="portalText"
                rows="3"
                placeholder="복수전공 신청 기간과 준비 서류를 알려줘"
              ></textarea>
              <button type="submit">Ask</button>
            </form>
          </section>

          <aside class="side-stack">
            <section class="panel">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Prepared</p>
                  <h2>미리 준비된 답변</h2>
                </div>
                <button id="refreshPrepared" type="button">Load</button>
              </div>
              <div id="preparedAnswers" class="list"></div>
            </section>

            <section class="panel">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Persona Worker</p>
                  <h2>예상 질문</h2>
                </div>
              </div>
              <div id="suggestedQuestions" class="chips"></div>
            </section>

            <section class="panel">
              <div class="section-head">
                <div>
                  <p class="eyebrow">Deadline Watch</p>
                  <h2>관심 행정 일정 등록</h2>
                </div>
              </div>
              <form id="watchForm" class="watch-form">
                <input id="watchIssue" value="복수전공" autocomplete="off" />
                <input id="watchDeadline" type="date" />
                <button type="submit">Register</button>
              </form>
              <div id="watchList" class="list compact-list"></div>
            </section>
          </aside>
        </section>
      </section>
    </main>
    <script src="/ui/portal.js"></script>
  </body>
</html>
